<!DOCTYPE html>
<!-- saved from url=(0132)https://storage.googleapis.com/runable-templates/cli-uploads%2Fq64Kjt0idGYHmkgjLhIaX24ONyKDfxbt%2FN5Dfv2SUEwiIkmad2iLA4%2Findex.html -->
<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKLogins Gerador</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#2d333b;
    --accent:#2ea043; --accent2:#238636; --red:#e11d48;
    --text:#e6edf3; --muted:#8b949e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:560px}
  h1{font-size:1.5rem;margin-bottom:4px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:.9rem}
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--border)}
  .tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;transition:.2s}
  .tab.active{background:var(--accent2);color:#fff}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input,select{
    width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);
    border-radius:9px;color:var(--text);font-size:1rem;margin-bottom:16px;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  button{
    width:100%;padding:12px;background:var(--accent);border:none;border-radius:9px;
    color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;
  }
  button:hover{background:var(--accent2)}
  .result{margin-top:18px}
  .num{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg);border:1px solid var(--border);border-radius:9px;
    padding:11px 14px;margin-bottom:8px;font-family:'Courier New',monospace;
    font-size:1.05rem;letter-spacing:1px;
  }
  .num button{width:auto;padding:6px 12px;font-size:.78rem;background:var(--border);color:var(--text)}
  .num button:hover{background:var(--accent2);color:#fff}
  .status{margin-top:16px;padding:14px;border-radius:9px;text-align:center;font-weight:700;font-size:1.05rem}
  .ok{background:rgba(46,160,67,.15);color:var(--accent);border:1px solid var(--accent)}
  .bad{background:rgba(225,29,72,.15);color:var(--red);border:1px solid var(--red)}
  .hidden{display:none}
  .hint{font-size:.75rem;color:var(--muted);margin-top:-10px;margin-bottom:16px}
  .checks{display:flex;gap:16px;align-items:center;height:44px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--text);font-size:.9rem;font-weight:600;margin:0;cursor:pointer}
  .chk input{width:auto;margin:0}
  .num .meta{display:flex;gap:14px;font-size:.82rem;color:var(--muted);letter-spacing:0}
  .num .meta b{color:var(--accent);font-weight:700}
  .num .left{display:flex;flex-direction:column;gap:4px}
  textarea{
    width:100%;min-height:160px;background:var(--bg);border:1px solid var(--border);
    border-radius:9px;color:var(--accent);font-family:'Courier New',monospace;
    font-size:1rem;letter-spacing:.5px;padding:13px;resize:vertical;outline:none;line-height:1.7;margin-bottom:12px;
  }
  textarea:focus{border-color:var(--accent)}
  .footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>BKLogins Gerador</h1>
  <p class="sub">Algoritmo de Luhn para testes</p>

  <div class="tabs">
    <div class="tab active" data-tab="gen">Gerar</div>
    <div class="tab" data-tab="val">Validar</div>
  </div>

  <!-- GERAR -->
  <div class="card" id="gen">
    <div class="row">
      <div>
        <label>Prefixo (BIN) — opcional</label>
        <input id="prefix" placeholder="ex: 555" inputmode="numeric">
      </div>
      <div>
        <label>Comprimento</label>
        <input id="length" type="number" value="16" min="2" max="19">
      </div>
    </div>
    <p class="hint">Deixe o prefixo vazio para números genéricos.</p>
    <div class="row">
      <div>
        <label>Quantidade</label>
        <input id="qty" type="number" value="5" min="1" max="10000">
      </div>
      <div>
        <label>Extras</label>
        <div class="checks">
          <label class="chk"><input type="checkbox" id="optDate" checked=""> Validade</label>
          <label class="chk"><input type="checkbox" id="optCvv" checked=""> CVV</label>
        </div>
      </div>
    </div>
    <div class="row" id="dateRow">
      <div>
        <label>Mês (MM)</label>
        <input id="mm" placeholder="aleatório" inputmode="numeric" maxlength="2">
      </div>
      <div>
        <label>Ano (AAAA)</label>
        <input id="yyyy" placeholder="aleatório" inputmode="numeric" maxlength="4">
      </div>
      <div>
        <label>CVV</label>
        <input id="cvvFixed" placeholder="aleatório" inputmode="numeric" maxlength="4">
      </div>
    </div>
    <p class="hint">Deixe os campos vazios para gerar aleatório. Preencha para fixar.</p>
    <button onclick="generate()">Gerar números</button>
    <div class="result" id="genResult"><textarea id="genOut" readonly="">1533892962439166|05|2030|544
8019945747942637|01|2028|080
0651022903059109|11|2032|930
5810126548976812|01|2029|763
4392393125027653|04|2032|109</textarea><button onclick="copyAll(this)">Copiar todos</button></div>
  </div>

  <!-- VALIDAR -->
  <div class="card hidden" id="val">
    <label>Número para validar</label>
    <input id="check" placeholder="Digite o número" inputmode="numeric">
    <button onclick="validate()">Validar</button>
    <div id="valResult"></div>
  </div>

  <p class="footer">Ferramenta para testes e estudo do algoritmo de Luhn.<br>Não gera dados reais de cartões válidos para uso financeiro.</p>
</div>

<script>
// ---- Luhn core ----
function luhnCheck(num){
  num = num.replace(/\D/g,'');
  if(num.length < 2) return false;
  let sum=0, alt=false;
  for(let i=num.length-1;i>=0;i--){
    let d=parseInt(num[i],10);
    if(alt){ d*=2; if(d>9) d-=9; }
    sum+=d; alt=!alt;
  }
  return sum%10===0;
}

function luhnDigit(partial){
  // partial = string without check digit
  let sum=0, alt=true;
  for(let i=partial.length-1;i>=0;i--){
    let d=parseInt(partial[i],10);
    if(alt){ d*=2; if(d>9) d-=9; }
    sum+=d; alt=!alt;
  }
  return (10-(sum%10))%10;
}

function genOne(prefix, length){
  let body = prefix.replace(/\D/g,'');
  while(body.length < length-1){
    body += Math.floor(Math.random()*10);
  }
  body = body.slice(0, length-1);
  return body + luhnDigit(body);
}

function genDate(){
  const mm = String(Math.floor(Math.random()*12)+1).padStart(2,'0');
  const year = new Date().getFullYear() + 1 + Math.floor(Math.random()*6); // 1-6 anos no futuro
  return {mm: mm, yyyy: String(year)};
}

function genCvv(len){
  let c=''; for(let i=0;i<len;i++) c+=Math.floor(Math.random()*10);
  return c;
}

// ---- UI ----
function generate(){
  const prefix = document.getElementById('prefix').value;
  const length = Math.max(2, Math.min(19, parseInt(document.getElementById('length').value)||16));
  const qty = Math.max(1, Math.min(10000, parseInt(document.getElementById('qty').value)||5));
  const withDate = document.getElementById('optDate').checked;
  const withCvv = document.getElementById('optCvv').checked;
  const fixMM = document.getElementById('mm').value.replace(/\D/g,'');
  const fixYYYY = document.getElementById('yyyy').value.replace(/\D/g,'');
  const fixCvv = document.getElementById('cvvFixed').value.replace(/\D/g,'');
  const box = document.getElementById('genResult');
  box.innerHTML='';

  // gera a quantidade exata; tenta evitar duplicados mas nunca gera menos
  const seen = new Set();
  const list = [];
  let tries=0;
  while(list.length<qty){
    const n = genOne(prefix, length);
    if(!seen.has(n) || tries>qty*60){ seen.add(n); list.push(n); }
    tries++;
  }

  const lines=[];
  list.forEach(n=>{
    const cvvLen = n.length===15 ? 4 : 3; // Amex usa 4
    let line = n;
    if(withDate){
      const d=genDate();
      const mm = fixMM ? fixMM.padStart(2,'0') : d.mm;
      const yyyy = fixYYYY ? fixYYYY : d.yyyy;
      line += '|'+mm+'|'+yyyy;
    }
    if(withCvv){
      line += '|'+(fixCvv ? fixCvv : genCvv(cvvLen));
    }
    lines.push(line);
  });
  const text = lines.join('\n');
  box.innerHTML=`<textarea id="genOut" readonly>${text}</textarea><button onclick="copyAll(this)">Copiar todos</button>`;
}

function copyAll(btn){
  const ta=document.getElementById('genOut');
  navigator.clipboard.writeText(ta.value).then(()=>{
    const old=btn.textContent; btn.textContent='Copiado!';
    setTimeout(()=>btn.textContent=old,1300);
  });
}

function validate(){
  const v=document.getElementById('check').value;
  const out=document.getElementById('valResult');
  if(!v.replace(/\D/g,'')){ out.innerHTML=''; return; }
  const ok=luhnCheck(v);
  out.innerHTML=`<div class="status ${ok?'ok':'bad'}">${ok?'✓ Válido (passa no Luhn)':'✗ Inválido'}</div>`;
}

function copy(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    const old=btn.textContent; btn.textContent='Copiado!';
    setTimeout(()=>btn.textContent=old,1200);
  });
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('gen').classList.toggle('hidden', t.dataset.tab!=='gen');
    document.getElementById('val').classList.toggle('hidden', t.dataset.tab!=='val');
  };
});

document.getElementById('check').addEventListener('input', validate);
generate();
</script>


</body></html>
